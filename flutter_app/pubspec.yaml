name: flutter_python_grpc
description: Flutter app with Python gRPC backend
version: 1.0.0+1

environment:
  sdk: '^3.5.6'

dependencies:
  flutter:
    sdk: flutter
  
  protobuf: ^6.0.0   # ← runtime library
  grpc: ^5.1.0       # ← aligns with protobuf 6
  process_run: ^1.0.0
  provider: ^6.0.5
  lottie: ^2.7.0
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  # File handling
  file_picker: ^8.3.6
  window_manager: ^0.5.1
  # Credential persistence (Remember me)
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/config/
    - assets/images/
dev_dependencies:
  flutter_test:
    sdk: flutter
