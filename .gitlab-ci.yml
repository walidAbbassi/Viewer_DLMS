  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/reports/security_scanner.md
      - backend/reports/security_scanner.html
  script:
    - New-Item -ItemType Directory -Force -Path backend\reports | Out-Null
    - Banner "🛡" "Security Scanner Agent"
    - '$tsStart = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()'
    - |
      if ($env:CI_MERGE_REQUEST_IID) { Info "Mode" "Merge Request !$env:CI_MERGE_REQUEST_IID" }
      else { Info "Mode" "Push (dry-run)" }
    - |
      if ($env:CI_MERGE_REQUEST_IID) {
        & $env:PYTHON_BIN -m agents.security_scanner --project-id $env:CI_PROJECT_ID --mr-iid $env:CI_MERGE_REQUEST_IID --scan-dir backend flutter_app\lib --output backend\reports\security_scanner.md --fail-on-high --push-mode
      } else {
        & $env:PYTHON_BIN -m agents.security_scanner --project-id $env:CI_PROJECT_ID --scan-dir backend flutter_app\lib --output backend\reports\security_scanner.md --fail-on-high --push-mode --dry-run
      }
      $agentCode = $LASTEXITCODE
    - |
      $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $tsStart
      $statusIcon = if ($agentCode -eq 0) { "$G✅$X" } else { "$R❌$X" }
      Write-Host ""
      Write-Host "$C  ┌─ Result ────────────────────────────────────────────────────┐$X"
      Write-Host "  │  Status    $statusIcon  exit=$agentCode"
      Write-Host "  │  Duration  ${elapsed}s"
      Write-Host "$C  └────────────────────────────────────────────────────────────────┘$X"
      Write-Host ''
      exit $agentCode
    - Ok "Security scanner completed"

agent_code_reviewer:
  extends: .agent_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: delayed
      start_in: 1 minute
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/reports/code_reviewer.md
      - backend/reports/code_reviewer.html
  script:
    - New-Item -ItemType Directory -Force -Path backend\reports | Out-Null
    - Banner "📝" "Code Reviewer Agent"
    - |
      $diffBase = if ($env:CI_MERGE_REQUEST_DIFF_BASE_SHA) { $env:CI_MERGE_REQUEST_DIFF_BASE_SHA } else { "HEAD~1" }
      Write-Host "$D  📊 Changed files (vs $diffBase, whitespace ignored):$X"
      git diff "$diffBase...HEAD" -w --stat | ForEach-Object { Write-Host "  $_" }
      Write-Host ''
      # Exclude auto-generated paths from the per-file diff loop to keep the
      # CI trace human-readable. The agent still scans the full diff via Python.
      $excludePatterns = @('^gen/', '^ng_sdk_whl/extracted/', 'flutter_app/lib/grpc/generated/', '__pycache__/', '\.dart_tool/', '/build/')
      $allFiles = @(git diff "$diffBase...HEAD" -w --name-only)
      $changedFiles = @($allFiles | Where-Object {
          $candidate = $_
          -not ($excludePatterns | Where-Object { $candidate -match $_ })
      })
      $skipped = $allFiles.Count - $changedFiles.Count
      foreach ($file in $changedFiles) {
        $safeId = 'review_' + ($file -replace '[^a-zA-Z0-9]', '_')
        $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        Write-Host "$($E)[0Ksection_start:$($ts):$safeId`[collapsed=true]`r$($E)[0K$D  📄 $file$X"
        git diff "$diffBase...HEAD" -w -- $file
        $ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        Write-Host "$($E)[0Ksection_end:$($ts):$safeId`r$($E)[0K"
      }
      if ($skipped -gt 0) {
        Write-Host "$D  ℹ  $skipped generated/extracted file(s) hidden — visible in GitLab Changes tab$X"
      }
    - '$tsStart = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()'
    - |
      if ($env:CI_MERGE_REQUEST_IID) { Info "Mode" "Merge Request !$env:CI_MERGE_REQUEST_IID" }
      else { Info "Mode" "Push (dry-run)" }
    - |
      if ($env:CI_MERGE_REQUEST_IID) {
        & $env:PYTHON_BIN -m agents.code_reviewer --project-id $env:CI_PROJECT_ID --mr-iid $env:CI_MERGE_REQUEST_IID --scan-dir backend flutter_app\lib --output backend\reports\code_reviewer.md --push-mode
      } else {
        & $env:PYTHON_BIN -m agents.code_reviewer --project-id $env:CI_PROJECT_ID --scan-dir backend flutter_app\lib --output backend\reports\code_reviewer.md --push-mode --dry-run
      }
      $agentCode = $LASTEXITCODE
    - |
      $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $tsStart
      $statusIcon = if ($agentCode -eq 0) { "$G✅$X" } else { "$R❌$X" }
      Write-Host ""
      Write-Host "$C  ┌─ Result ────────────────────────────────────────────────────┐$X"
      Write-Host "  │  Status    $statusIcon  exit=$agentCode"
      Write-Host "  │  Duration  ${elapsed}s"
      Write-Host "$C  └────────────────────────────────────────────────────────────────┘$X"
      Write-Host ''
      exit $agentCode
    - Ok "Code reviewer completed"

