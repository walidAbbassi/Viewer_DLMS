    - New-Item -ItemType Directory -Force -Path backend\reports | Out-Null
    - Banner "📈" "Flutter Coverage Agent"
    - '$tsStart = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()'
    - |
      if ($env:CI_MERGE_REQUEST_IID) { Info "Mode" "Merge Request !$env:CI_MERGE_REQUEST_IID" }
      else { Info "Mode" "Push (dry-run)" }
    - |
      if ($env:CI_MERGE_REQUEST_IID) {
        & $env:PYTHON_BIN -m agents.flutter_coverage_agent --project-id $env:CI_PROJECT_ID --mr-iid $env:CI_MERGE_REQUEST_IID --lcov-file backend\reports\ci_inputs\lcov.info --output backend\reports\flutter_coverage.md --push-mode
      } else {
        & $env:PYTHON_BIN -m agents.flutter_coverage_agent --project-id $env:CI_PROJECT_ID --lcov-file backend\reports\ci_inputs\lcov.info --output backend\reports\flutter_coverage.md --push-mode --dry-run
      }
      $agentCode = $LASTEXITCODE
    - |
      $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $tsStart
      $statusIcon = if ($agentCode -eq 0) { "$G✅$X" } else { "$R❌$X" }
      Write-Host ""
      Write-Host "$C  ┌─ Result ────────────────────────────────────────────────────┐$X"
      Write-Host "  │  Status    $statusIcon  exit=$agentCode"
      Write-Host "  │  Duration  ${elapsed}s"
      Write-Host "$C  └────────────────────────────────────────────────────────────────┘$X"
      Write-Host ''
      exit $agentCode
    - Ok "Flutter coverage completed"

pipeline_report:
  stage: report
  tags:
    - $RUNNER_TAG
  rules: *agent_rules
  allow_failure: true
  needs:
    - job: agent_code_reviewer
      artifacts: true
    - job: agent_code_explainer
      artifacts: true
    - job: agent_license_compliance
      artifacts: true
    - job: agent_flutter_analyzer
      artifacts: true
    - job: agent_flutter_coverage
      artifacts: true
    - job: agent_test_coverage
      artifacts: true
    - job: agent_dependency_audit
      artifacts: true
    - job: agent_security_scanner
      artifacts: true
    - job: agent_documentation
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/reports/
  before_script:
    - *ci_log_init
    - *pip_section_start
    - '& $env:PYTHON_BIN -m pip install httpx --retries $env:PIP_RETRIES --timeout $env:PIP_TIMEOUT'
    - *pip_section_end
  script:
    - Banner "🧾" "Pipeline Report Agent"
    - '$tsStart = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()'
    - SectionStart "report_exec" "🧾 report execution (click to expand)"
    - |
      if ($env:CI_MERGE_REQUEST_IID) {
        Info "Mode" "Merge Request !$env:CI_MERGE_REQUEST_IID"
        & $env:PYTHON_BIN -m agents.pipeline_report_agent --project-id $env:CI_PROJECT_ID --mr-iid $env:CI_MERGE_REQUEST_IID --reports-dir backend\reports --output backend\reports\pipeline_report.md --push-mode
      } else {
        Info "Mode" "Push (dry-run)"
        & $env:PYTHON_BIN -m agents.pipeline_report_agent --project-id $env:CI_PROJECT_ID --reports-dir backend\reports --output backend\reports\pipeline_report.md --push-mode --dry-run
      }
      $agentCode = $LASTEXITCODE
    - SectionEnd "report_exec"
    - |
      $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $tsStart
      $statusIcon = if ($agentCode -eq 0) { "$G✅$X" } else { "$R❌$X" }
      Write-Host ""
      Write-Host "$C  ┌─ Result ────────────────────────────────────────────────────┐$X"
      Write-Host "  │  Status    $statusIcon  exit=$agentCode"
      Write-Host "  │  Duration  ${elapsed}s"
      Write-Host "$C  └────────────────────────────────────────────────────────────────┘$X"
      Write-Host ''
      exit $agentCode
    - Ok "Pipeline report completed"

notify_pipeline_completion:
  stage: deploy
  tags:
    - $RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  allow_failure: true
  needs:
    - job: pipeline_report
      artifacts: true
  dependencies:
    - pipeline_report
  before_script:
    - *ci_log_init
    - *pip_section_start
    - '& $env:PYTHON_BIN -m pip install requests --retries $env:PIP_RETRIES --timeout $env:PIP_TIMEOUT'
    - *pip_section_end
  script:
    - Banner "📧" "Pipeline Completion Notification"
    - 'Info "Pipeline" "#$env:CI_PIPELINE_ID  |  MR: !$env:CI_MERGE_REQUEST_IID"'
    - 'Info "Mode" "GitLab API note → native email via GitLab SMTP relay"'
    - |
      & $env:PYTHON_BIN tools\notify_pipeline_gitlab.py `
        --pipeline-id $env:CI_PIPELINE_ID `
        --mr-iid $env:CI_MERGE_REQUEST_IID `
        --project-id $env:CI_PROJECT_ID `
        --artifacts-dir backend\reports
      $notifyExit = $LASTEXITCODE
    - |
      if ($notifyExit -eq 0) {
        Write-Host "$G✅ Pipeline completion note posted — GitLab will send native email notification$X"
      } else {
        Write-Host "$R❌ Notification failed (exit $notifyExit) — check GITLAB_TOKEN and API connectivity$X"
      }
    - exit $notifyExit

deploy_staging:
  stage: deploy
  tags:
    - $RUNNER_TAG
  when: manual
  only:
    - main
  script:
    - *ci_log_init
    - Banner "🚀" "Deploy Staging"
    - Info "Status" "Manual deploy placeholder -- add deploy steps here"



