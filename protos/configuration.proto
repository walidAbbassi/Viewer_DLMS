syntax = "proto3";

package config;

import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";

message ConfigEntry {
  string module = 1;
  string key    = 2;
  google.protobuf.Any value = 3;
}

message SetConfigRequest {
  repeated ConfigEntry entries = 1;
  bool to_file = 2; // if true, persist to file (server-defined location)
}

message SetConfigResponse {
  bool success = 1;
  string message = 2;
}

message ConfigIdentifier { string module = 1; string key = 2; }
message GetConfigRequest { repeated ConfigIdentifier identifiers = 1; }
message GetConfigResponse { repeated ConfigEntry entries = 1; }

message ListModulesResponse { repeated string modules = 1; }

// ---------------------------------------------------------------------------
// Export templates
// ---------------------------------------------------------------------------

message SetExportTemplatesRequest {
  string page_name    = 1;
  string xml_template  = 2;
  string csv_template  = 3;
  string pdf_template  = 4;
  string docx_template = 5;
}

message SetExportTemplatesResponse {
  bool success = 1;
}

message GetExportTemplatesRequest {
  string page_name = 1;
}

message GetExportTemplatesResponse {
  string xml_template  = 1;
  string csv_template  = 2;
  string pdf_template  = 3;
  string docx_template = 4;
}

message ExportTemplateFileEntry {
  string type  = 1;           // e.g. "xml", "csv", "pdf", "docx"
  repeated string files = 2;  // list of template file paths / names
}

message ListExportTemplateFilesResponse {
  repeated ExportTemplateFileEntry entries = 1;
}

service ConfigService {
  rpc SetConfig            (SetConfigRequest)           returns (SetConfigResponse);
  rpc GetConfig            (GetConfigRequest)           returns (GetConfigResponse);
  rpc ListModules          (google.protobuf.Empty)      returns (ListModulesResponse);
  rpc SetExportTemplates        (SetExportTemplatesRequest)       returns (SetExportTemplatesResponse);
  rpc GetExportTemplates        (GetExportTemplatesRequest)       returns (GetExportTemplatesResponse);
  rpc ListExportTemplateFiles   (google.protobuf.Empty)          returns (ListExportTemplateFilesResponse);
}
