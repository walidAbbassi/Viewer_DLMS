syntax = "proto3";

package meter;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";


// ==========================
// XML/XDR translation (NEW)
// ==========================
message TranslateDataItemRequest {
  // Input data as string (can be XML or XDR).
  string data = 1;

  // true  -> input is XDR, server returns XML
  // false -> input is XML, server returns XDR
  bool is_xdr_input = 2;
}

message TranslateDataRequest {
  // Multiple items to translate in one call.
  repeated TranslateDataItemRequest requests = 1;
}

message TranslateDataItemResponse {
  // Echo of input (optional but useful for debugging).
  string input = 1;

  // Translated data (XML or XDR, depending on is_xdr_input).
  string output = 2;

  // Echo of direction to know how it was processed.
  bool is_xdr_input = 3;

  // Result status.
  bool success = 4;
  string error = 5; // non-empty if success == false
}

message TranslateDataResponse {
  repeated TranslateDataItemResponse items = 1;
}

message DlmsTranslateRequest {
  string data = 1;   // XDR hex string or XML string
  bool isxml = 2;    // true -> input is XML (XML→XDR), false -> input is XDR (XDR→XML)
}


// ==========================
// Requests
// ==========================
message GetRequest {
  int32 class_   = 1;  // DLMS/COSEM class id
  string obiscode = 2; // hex/OBIS string (e.g., "1-0:1.8.0")
  int32 attribute = 3; // attribute index

  // Access selector: none (default), datetime range, or entry selector
  oneof access_selector {
    DateTimeRangeSelector datetime_selector = 4;
    EntrySelector entry_selector    = 5;
  }
}

// Datetime range selector (start/end)
message DateTimeRangeSelector {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end   = 2;
}

// Entry selector with two ranges: entry and selected
message EntrySelector {
  int32 entry_from    = 1;
  int32 entry_to      = 2;
  int32 selected_from = 3;
  int32 selected_to   = 4;
}

message SetRequest {
  int32 class_ = 1;
  string obiscode = 2;     // hex/OBIS string
  int32 attribute = 3;
  string payload = 4;      // hex string
}

message ActionRequest {
  int32 class_ = 1;
  string obiscode = 2;     // hex/OBIS string
  int32 attribute = 3;
  string payload = 4;      // hex string
}

// Polymorphic envelope for a frame request
message AbstractFrameRequest {
  oneof request {
    GetRequest get_request       = 1;
    SetRequest set_request       = 2;
    ActionRequest action_request = 3;
  }
}

// ==========================
// Responses
// ==========================
message ApplicationResponse {
  AbstractFrameRequest request = 1; // original request
  google.protobuf.Any value     = 2; // any result message
  string error                  = 3; // error message if any
  int32 status_code             = 4; // application-level status
}

// For the new simpler ExecuteGet/Set/Action RPCs
message FrameExecutionItem {
  AbstractFrameRequest request = 1; // original request
  string xml_xdr               = 2; // XML representation of XDR
  string xdr                   = 3; // raw XDR (e.g., hex)
  bool success                 = 4; // true if ok
  string error                 = 5; // error message if any, empty if success
}

message FrameExecutionList {
  repeated FrameExecutionItem items = 1;
}

// ==========================
// Helper messages
// ==========================
message BoolValue {
  bool value = 1;
}

message Int32Value {
  int32 value = 1;
}


message StringValue {
  string value = 1;
}


message StringList {
  repeated string items = 1;
}



// Lists + with_list flag
message GetRequestList {
  repeated GetRequest requests = 1;
  bool with_list = 2; // true = use DLMS "GET with list", false = individual
}

message SetRequestList {
  repeated SetRequest requests = 1;
  bool with_list = 2; // true = use DLMS "SET with list", false = individual
}

message ActionRequestList {
  repeated ActionRequest requests = 1;
  bool with_list = 2; // true = use DLMS "ACTION with list", false = individual
}

message ApplicationResponseList {
  repeated ApplicationResponse responses = 1;
}

