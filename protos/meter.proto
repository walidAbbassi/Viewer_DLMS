// Progression d’exécution (avant transfert “massif”)
message ExecutionProgress {
  string message = 1;             // message humain (optionnel)
}



// Progression de téléchargement des données (pendant la lecture “longue”)
message DownloadProgress {
  uint64 rows_total = 1;          // si connu (0 sinon)
  int32 percent = 2;              // 0..100 (si rows_total connu)
  uint64 bytes_total = 3;         // si connu (0 sinon)
  uint64 bytes_read = 4;          // cumul
  double rate_bytes_per_sec = 5;  // débit moyen estimé
}


message GetLoadProfileStreamItem {
  oneof item {
    ExecutionProgress exec = 1;
    DownloadProgress download = 2;
	GetLoadProfileResponse result = 3;
  }
}


message ActivationDateTime {
  int32 year = 1;   // e.g., 2026
  int32 month = 2;  // 1..12
  int32 day = 3;    // 1..31 (validate server-side)
  int32 hour = 4;   // 0..23 (24h)
  int32 minute = 5; // 0..59
  int32 second = 6; // 0..59
}

message DaylightSavingsTime {
  int32 day = 1;    // 1..31, or special values: 253 (second-to-last), 254 (last), 255 (unspecified)
  int32 month = 2;  // 1..12
  int32 hour = 3;   // 0..23
  int32 minute = 4; // 0..59
  int32 second = 5; // 0..59
  int32 dayOfWeek = 6; // 1..7 (1=Monday, 7=Sunday), or 255 (unspecified)
}




// Each phase reading: voltage (u), current (i), phase angle (phi).
message PhaseData {
  double u = 1;   // e.g., volts
  double i = 2;   // e.g., amperes
  double phi = 3; // radians or degrees (document your convention)
}

// Wrap the list to keep response extensible.
message FresnelResponse {
  repeated PhaseData phases = 1;
}


