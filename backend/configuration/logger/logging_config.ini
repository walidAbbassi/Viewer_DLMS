[SDK_NG_CONFIGURATION_DEBUG]
file_log = log_{time:YYYY-MM-DD-HH-mm-ss-SSS}.log
console_log = true
level_file = DEBUG
level_console = DEBUG
rotation = 10 MB
backtrace = false
diagnose = false
colorize_console = true
catch = true
compression = zip

# structured logging switches
structured_enabled = true
structured_format  = jsonl
structured_file    = structured_{time:YYYY-MM-DD-HH-mm-ss-SSS}.jsonl
# 🔽 NEW: HTML log
html_enabled     = true
html_file        = log_{time:YYYY-MM-DD-HH-mm-ss-SSS}.html
html_title       = SDK Debug Log
html_inline_css  = true

[SDK_NG_CONFIGURATION_PRODUCTION]
file_log = log_{time:YYYY-MM-DD-HH-mm-ss-SSS}.log
console_log = false
level_file = INFO
level_console = INFO
rotation = 50 MB
backtrace = false
diagnose = false
colorize_console = false
catch = true
compression = gz
